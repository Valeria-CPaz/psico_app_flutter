<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PsicoApp — Gestão de pacientes e agenda para psicólogos autônomos">

  <!-- PWA: Android -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#a3961e">

  <!-- PWA: iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PsicoApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>PsicoApp</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google AdSense
    ──────────────────────────────────────────────────────────────────────────
    1. Crie uma conta em https://adsense.google.com
    2. Substitua "ca-pub-XXXXXXXXXXXXXXXX" pelo seu Publisher ID
    3. Substitua "XXXXXXXXXX" no data-ad-slot pelo ID do bloco de anúncio
    ──────────────────────────────────────────────────────────────────────────
  -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
     crossorigin="anonymous"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f0eccc;
      display: flex;
      flex-direction: column;
    }

    /* Banner de anúncio — fixo no topo, não intrusivo */
    #ad-banner {
      width: 100%;
      min-height: 60px;
      max-height: 90px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0eccc;
    }

    /* Área do app Flutter ocupa o restante da tela */
    #flutter-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Anúncio horizontal não intrusivo, fixo no topo -->
  <div id="ad-banner">
    <ins class="adsbygoogle"
         style="display:inline-block; width:320px; height:50px;"
         data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
         data-ad-slot="XXXXXXXXXX"
         data-ad-format="horizontal"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <!-- Container do Flutter (ocupa todo o espaço restante) -->
  <div id="flutter-container"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
